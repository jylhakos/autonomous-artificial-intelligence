### model parameters
model_name_or_path: openai-community/gpt2

### method parameters
# stage: pt  runs pre-training (causal language modelling on unlabelled text)
# finetuning_type: full  updates all model weights (no adapter / LoRA)
stage: pt
do_train: true
finetuning_type: full

### dataset parameters
# c4_demo is a small C4 subset bundled with LLaMA-Factory for quick tests.
# Replace with your own dataset name registered in data/dataset_info.json
# for a real pre-training run.
dataset: c4_demo
cutoff_len: 1024
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 4

### output parameters
output_dir: outputs/gpt2_pretrain_ddp
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### training parameters
# GPT-2 (124 M) fits comfortably on a single 12 GB GPU in fp16.
# batch 8 x seq 1024 consumes approx 3 GB VRAM per GPU -- DDP is sufficient.
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.05
fp16: true
ddp_timeout: 180000000
