### model parameters
model_name_or_path: openai-community/gpt2-xl

### method parameters
stage: pt
do_train: true
finetuning_type: full

### dataset parameters
dataset: c4_demo
cutoff_len: 1024
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 4

### output parameters
output_dir: outputs/gpt2xl_pretrain_ds_z3_offload
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### training parameters
# ZeRO-3 shards ALL states (parameters, gradients, optimizer) across GPUs.
# CPU offload additionally moves sharded parameters and optimizer states to
# system RAM, enabling training models far larger than 24 GB combined VRAM.
# Host system RAM requirement: >= 64 GB.
# Expect significant throughput reduction due to PCIe transfers.
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 3.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### deepspeed
deepspeed: configs/ds_z3_offload_config.json
