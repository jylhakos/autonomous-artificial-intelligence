# LLaMA-Factory Accelerate configuration for single-node 2-GPU DDP training.
# Reference: https://llamafactory.readthedocs.io/en/latest/advanced/distributed.html
#
# Distribute work across 2 GPUs using DistributedDataParallel.
# Each GPU holds a complete copy of the model; gradients are averaged
# across GPUs at each backward pass via NCCL all-reduce.

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
gpu_ids: 0,1
machine_rank: 0
main_training_function: main
mixed_precision: fp16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
