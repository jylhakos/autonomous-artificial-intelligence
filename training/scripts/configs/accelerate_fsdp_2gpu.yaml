# LLaMA-Factory Accelerate configuration for single-node 2-GPU FSDP training.
# Reference: https://llamafactory.readthedocs.io/en/latest/advanced/distributed.html
#
# fsdp_sharding_strategy: FULL_SHARD
#   Shards model parameters, gradients, and optimizer states across all GPUs.
#   Equivalent to DeepSpeed ZeRO-3 in memory savings.
#
# fsdp_offload_params: true
#   Additionally offloads sharded parameters to CPU RAM.
#   Use when GPU VRAM is still insufficient after FULL_SHARD.
#   Set to false on GPUs with more headroom to improve throughput.
#
# fsdp_cpu_ram_efficient_loading: true
#   Each rank only loads its own parameter shard during model init,
#   avoiding the need to fit the full model in RAM on a single process.

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: true
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
machine_rank: 0
main_training_function: main
mixed_precision: fp16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
