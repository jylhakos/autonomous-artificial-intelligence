# =============================================================================
# Nginx reverse-proxy configuration for the LLM FastAPI inference server.
#
# Architecture
# ------------
#   Client ──► Nginx :80  ──auth_request──► FastAPI /auth
#                          └──proxy_pass──► FastAPI :8000
#
# Authorization
# -------------
#   Every incoming request triggers an internal sub-request to /internal/auth.
#   Nginx forwards the Authorization header to FastAPI, which returns:
#     HTTP 200  →  Nginx forwards the real request to FastAPI.
#     HTTP 401  →  Nginx returns 401 to the client immediately.
#
# Installation (Ubuntu / Debian)
# ------------------------------
#   sudo cp nginx.conf /etc/nginx/sites-available/llm-server
#   sudo ln -s /etc/nginx/sites-available/llm-server \
#              /etc/nginx/sites-enabled/llm-server
#   sudo nginx -t          # validate
#   sudo systemctl reload nginx
#
# FastAPI must be started with proxy-header trust enabled:
#   uvicorn api_server:app --host 127.0.0.1 --port 8000 \
#       --proxy-headers --forwarded-allow-ips=127.0.0.1
# =============================================================================

server {
    listen 80;
    server_name _;   # Replace with your domain name or public IP address

    # -------------------------------------------------------------------------
    # Timeouts — LLM inference can take tens of seconds
    # -------------------------------------------------------------------------
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    # Accept large request bodies (long prompts / conversation histories)
    client_max_body_size  10m;

    # Custom access log that records the upstream response time
    log_format llm_log '$remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/llm_access.log llm_log;
    error_log  /var/log/nginx/llm_error.log  warn;

    # -------------------------------------------------------------------------
    # Internal auth sub-request location.
    #
    # Nginx sends a lightweight HEAD-like sub-request here before every real
    # request.  Marked `internal` so external clients cannot call it directly.
    # The real request body is NOT forwarded; only the Authorization header is.
    # -------------------------------------------------------------------------
    location = /internal/auth {
        internal;

        proxy_pass              http://127.0.0.1:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Original-URI   $request_uri;

        # Forward the client's Bearer token so FastAPI can validate it
        proxy_set_header        Authorization    $http_authorization;
    }

    # -------------------------------------------------------------------------
    # Public health-check endpoint — no authentication required
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass          http://127.0.0.1:8000/health;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Prometheus /metrics — accessible from localhost only (scraper network)
    # -------------------------------------------------------------------------
    location = /metrics {
        allow  127.0.0.1;
        deny   all;
        proxy_pass http://127.0.0.1:8000/metrics;
    }

    # -------------------------------------------------------------------------
    # All other routes — protected by the auth_request sub-request
    # -------------------------------------------------------------------------
    location / {
        # Trigger the auth sub-request; any non-2xx response blocks the call
        auth_request /internal/auth;

        # Return a 401 with a WWW-Authenticate challenge on auth failure
        error_page 401 = @unauthorized;

        proxy_pass              http://127.0.0.1:8000;
        proxy_http_version      1.1;
        proxy_set_header        Connection         "";
        proxy_set_header        Host               $host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto  $scheme;

        # Pass the original Authorization header through to FastAPI so that
        # the /auth sub-request and the inference endpoint both see it
        proxy_set_header        Authorization      $http_authorization;

        # Disable response buffering — important for streaming responses
        proxy_buffering         off;
    }

    location @unauthorized {
        add_header  WWW-Authenticate 'Bearer realm="LLM Inference Server"' always;
        return      401;
    }
}
